<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Brand & Browser Appearance -->
    <meta name="theme-color" content="#332A24" />
    <meta
      name="theme-color"
      content="#332A24"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#332A24"
      media="(prefers-color-scheme: dark)"
    />

    <meta name="color-scheme" content="light" />

    <!-- Identity -->
    <title>AUREL | Specialty Coffee Roastery</title>
    <link rel="canonical" href="https://aurel-coffe.vercel.app/" />

    <meta
      name="description"
      content="Discover coffee through taste. Explore thoughtfully sourced specialty beans, find your flavor profile, and learn the craft of better brewing at AUREL."
    />

    <meta name="application-name" content="AUREL Coffee Roastery" />

    <meta name="author" content="AUREL Coffee Roastery" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/public/images/logo/logo.png" />

    <!-- Apple / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="AUREL" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AUREL Coffee Roastery" />
    <meta property="og:title" content="AUREL | The Artisanal Roastery" />
    <meta
      property="og:description"
      content="Find your kind of coffee. Explore distinctive flavors, thoughtfully sourced beans, and the art of better brewing."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Social Sharing -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AUREL | The Artisanal Roastery" />
    <meta
      name="twitter:description"
      content="Every bean has a story. Every cup, a character."
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
